name: ci

# Tests on every push and pull request on Windows, Linux and macOS, and proves that what a release ships works:
# the self-contained binary and the NuGet tool both start and speak MCP. No database is involved, because the
# runners have no SQL Anywhere driver; the smoke test checks the protocol, not the connection.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # A hung test must fail the job with the test's name, not stall it until GitHub's 6-hour limit.
      - run: dotnet test -c Release --blame-hang --blame-hang-timeout 2m

  binary:
    name: Binary smoke test (${{ matrix.rid }})
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest, exe: sqlanywhere-mcp }
          - { rid: win-x64, os: windows-latest, exe: sqlanywhere-mcp.exe }
          - { rid: osx-arm64, os: macos-latest, exe: sqlanywhere-mcp }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: bash
        run: scripts/publish.sh "${{ matrix.rid }}" dist/sqlanywhere-mcp
      - name: Smoke test
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SqlAnywhereMcp/SqlAnywhereMcp.csproj)
          scripts/smoke.sh "dist/sqlanywhere-mcp/${{ matrix.exe }}" "$version"

  package:
    name: NuGet package
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack src/SqlAnywhereMcp -c Release -o dist
      - name: Check the package contents
        run: |
          set -euo pipefail
          ls -l dist
          main=$(ls dist/SqlAnywhereMcp.[0-9]*.nupkg)
          for entry in .mcp/server.json README.md LICENSE; do
            unzip -l "$main" | grep -q " $entry\$" || { echo "::error::$entry is missing from $main"; exit 1; }
          done
          unzip -p "$main" README.md | grep -q 'mcp-name: io.github.Dwarf1er/sqlanywhere-mcp' \
            || { echo "::error::the package README has no mcp-name line"; exit 1; }
          # nuget.org renders only Markdown, so the HTML header of the repository README must not be in the package.
          if unzip -p "$main" README.md | grep -q '<div'; then echo "::error::the package README still has HTML"; exit 1; fi
      - name: Install the tool from the package and smoke test it
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SqlAnywhereMcp/SqlAnywhereMcp.csproj)
          dotnet tool install SqlAnywhereMcp --tool-path "$RUNNER_TEMP/tool" --add-source dist --version "$version"
          scripts/smoke.sh "$RUNNER_TEMP/tool/sqlanywhere-mcp" "$version"

  plugin:
    name: Claude Code plugin files
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the plugin files
        run: |
          set -euo pipefail
          jq empty .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/.mcp.json
          # A marketplace entry whose name differs from the plugin's own name can't be installed by that name.
          [ "$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)" = "$(jq -r '.name' plugin/.claude-plugin/plugin.json)" ]
          # The plugin must run the package this project publishes.
          package=$(sed -n 's:.*<PackageId>\(.*\)</PackageId>.*:\1:p' src/SqlAnywhereMcp/SqlAnywhereMcp.csproj)
          [ "$(jq -r '.mcpServers.sqlanywhere.args[0]' plugin/.mcp.json)" = "$package" ]
